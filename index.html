<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mars Zeka">
<meta name="description" content="QR ile masadan sipariş demosu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Mars Zeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Mars Zeka — ortak stil. Palet: krem #FFF8EC, kum #F2E3C6, kırmızı #D62828, bordo #9D0208, kahve-siyah #3A0A0A.
   Tek görünüm (marka kimliği); her renk açıkça tanımlı. */
:root{
  --cream:#FFF8EC; --sand:#F2E3C6; --red:#D62828; --wine:#9D0208; --ink:#3A0A0A;
  --soft:#6E4A42; --line:#E8D8BA; --line-2:#DCC59C; --white:#FFFDF8;
  --ok:#2E6B3A; --ok-soft:#E3EFDC; --warn-soft:#FBE3D9;
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-body:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em}
[hidden]{display:none!important}
a{color:var(--wine)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink);background:var(--white);border:1px solid var(--line-2);border-radius:4px;padding:.6rem .7rem;width:100%;min-width:0}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.muted{color:var(--soft)} .small{font-size:.86rem} .center{text-align:center} .wide{width:100%}
.num{font-family:var(--f-display);font-variant-numeric:lining-nums tabular-nums}
.label{display:block;font-size:.68rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.55rem 1.1rem;border-radius:4px;border:1px solid var(--line-2);background:var(--white);color:var(--ink);font-weight:500;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--wine)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--wine);border-color:var(--wine);color:var(--cream)}
.btn-primary:hover{background:var(--ink);border-color:var(--ink)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--cream)}
.btn-ghost{background:transparent}
.btn-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn-bad{background:var(--warn-soft);border-color:transparent;color:var(--wine)}
.btn-sm{min-height:36px;padding:.3rem .75rem;font-size:.88rem}
.btn-lg{min-height:54px;font-size:1.02rem;letter-spacing:.04em}
.row-btns{display:flex;flex-wrap:wrap;gap:10px}
.sound-bar{display:block;width:100%;border:0;background:var(--red);color:#fff;font-weight:500;padding:12px 16px;text-align:center}
@media (max-width:820px){input,textarea,select{font-size:16px}}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:.7rem 1.1rem;border-radius:4px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(58,10,10,.5)}
.empty-card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:8px}
.empty-card h2{font-size:1.6rem}
.empty-card p{color:var(--soft)}
.offline{background:var(--warn-soft);color:var(--wine);font-weight:500;font-size:.88rem;text-align:center;padding:8px 16px}
.chip{font-size:.72rem;font-weight:500;padding:.15rem .5rem;border-radius:3px;background:var(--sand);color:var(--ink);white-space:nowrap}

/* ---------- giriş ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);padding:30px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 8px var(--cream),0 0 0 9px var(--line)}
.login-card h1{font-size:2rem}
.brand-sm{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--wine)}
.login-form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:500;letter-spacing:.06em;color:var(--soft);min-width:0}
.form-err{color:var(--wine);font-weight:500;font-size:.9rem}

/* ---------- müşteri ---------- */
.c-wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.c-head{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.c-head-in{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.c-name{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.05;overflow-wrap:anywhere}
.waiter-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;border:1px solid var(--wine);background:var(--white);color:var(--wine);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:500;white-space:nowrap}
.waiter-btn.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
@media (max-width:420px){.c-name{font-size:1.35rem}}
@media (max-width:380px){.waiter-btn{padding:7px 9px;font-size:.76rem}}
.c-table{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);background:var(--wine);padding:6px 10px;border-radius:3px;white-space:nowrap}
.c-chips{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.c-chips::-webkit-scrollbar{display:none}
.c-chips a,.c-chips button{font-family:inherit;cursor:pointer;flex-shrink:0;text-decoration:none;color:var(--ink);font-size:.86rem;border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;background:var(--white)}
.c-main{display:flex;flex-direction:column;gap:26px;padding-block:20px 40px}
.c-main.has-bar{padding-bottom:200px}
.c-intro{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--soft);text-align:center}
.ar-open{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;background:var(--sand);border:1px solid var(--line-2);color:var(--wine);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:500}
#arLayer{position:fixed;inset:0;z-index:60;background:rgba(58,10,10,.55);display:flex;align-items:flex-end;justify-content:center}
.ar-box{width:100%;max-width:560px;max-height:100%;background:var(--cream);border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.ar-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ar-head h2{font-size:1.7rem;line-height:1.1}
.ar-stage{position:relative;height:min(58vh,440px);border-radius:10px;overflow:hidden;background:var(--sand);display:flex;align-items:center;justify-content:center}
.ar-wait{color:var(--soft);font-size:.9rem;text-align:center;padding:20px}
.ar-btn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;background:var(--wine);color:var(--cream);border:0;border-radius:999px;padding:12px 20px;font-weight:500;box-shadow:0 8px 20px -6px rgba(58,10,10,.5)}
.ar-note{font-size:.84rem;color:var(--soft)}
.alg-line{font-size:.76rem;color:var(--soft);letter-spacing:.02em}
.alg-warn{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:.74rem;font-weight:600;color:#fff;background:var(--red);border-radius:3px;padding:3px 8px}
.dish.avoid .dish-img{opacity:.55}
.dish.avoid .dish-name{color:var(--soft)}
.alg-filter{display:flex;flex-direction:column;gap:8px}
.alg-toggle{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:.84rem;color:var(--ink)}
.alg-panel{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.88rem;color:var(--soft)}
.alg-chips{display:flex;flex-wrap:wrap;gap:6px}
.alg-chip{border:1px solid var(--line-2);background:var(--cream);border-radius:999px;padding:7px 12px;font-size:.84rem;color:var(--ink)}
.alg-chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.alg-small{font-size:.76rem}
.eta-list{display:flex;flex-direction:column;gap:8px}
.eta-banner{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--cream);border-radius:6px;padding:12px 14px}
.eta-banner svg{flex-shrink:0;color:var(--sand)}
.eta-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.eta-txt b{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.eta-txt span{font-size:.8rem;color:#C9AE95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eta-num{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.eta-num strong{font-family:var(--f-display);font-size:2rem;font-weight:700;color:var(--sand)}
.eta-num strong.soon{font-size:1.15rem}
.eta-num small{font-size:.68rem;letter-spacing:.08em;color:#C9AE95;margin-top:2px}
.cat-h{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:1.6rem;font-weight:600;margin-bottom:6px}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line-2)}
.dish{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish-img{width:104px;height:104px;border-radius:6px;overflow:hidden;background:var(--sand);position:relative}
.dish-img img,.dish-img .ph-svg{width:100%;height:100%;object-fit:cover;display:block}
.dish.out .dish-img{filter:grayscale(1);opacity:.55}
.dish-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.dish-name{font-family:var(--f-display);font-size:1.32rem;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.dish-desc{font-size:.86rem;color:var(--soft);line-height:1.4}
.dish-meta{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.dish-price{font-family:var(--f-display);font-weight:700;font-size:1.3rem;white-space:nowrap}
.dish-time{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--soft)}
.dish-time svg{flex-shrink:0}
.dish-time{flex-wrap:wrap}
.kcal{display:inline-flex;align-items:center;gap:4px;flex-basis:100%;margin-top:2px}
.por-l{display:flex;flex-direction:column;line-height:1.2}
.por-l small{font-size:.7rem;color:var(--soft);opacity:.85}
.dish-meta.portion{padding-top:6px;gap:8px}
.dish-meta.portion .round{width:34px;height:34px}
.dish-meta.portion .stepper{gap:6px}
.dish-meta.portion .dish-price{font-size:1.15rem}
.dish-meta.portion+.dish-meta.portion{border-top:1px dashed var(--line);margin-top:4px}
.por-l{font-size:.8rem;color:var(--soft);white-space:nowrap}
.dish-out{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:500}
.stepper{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.stepper .q{min-width:1.4em;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--white);display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;line-height:1}
.round-add{background:var(--wine);border-color:var(--wine);color:var(--cream)}
.c-bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--white);border-top:1px solid var(--line-2);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -18px rgba(58,10,10,.35)}
.c-bar-in{display:flex;flex-direction:column;gap:8px}
.c-bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.9rem;color:var(--soft)}
.c-bar-top b{font-family:var(--f-display);font-size:1.35rem;color:var(--ink)}
.note-in{font-size:.92rem}
.done{background:var(--white);border:1px solid var(--line);padding:10px}
.done-in{border:1px solid var(--line-2);padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.done-ico{width:64px;height:64px;border-radius:50%;background:var(--wine);color:var(--cream);display:flex;align-items:center;justify-content:center}
.done h2{font-size:2rem;line-height:1.1}
.done-eta{font-family:var(--f-display);font-size:3.4rem;font-weight:700;line-height:1;color:var(--wine)}
.done-eta small{font-size:1.2rem;font-weight:600;color:var(--ink)}
.done p{color:var(--soft)}
.bill{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.bill h3{font-size:1.35rem;display:flex;justify-content:space-between;align-items:baseline}
.bill ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.bill li{display:flex;justify-content:space-between;gap:12px}
.bill li span:last-child{white-space:nowrap}
.bill-total{display:flex;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:8px;font-weight:500}
.bill-total b{font-family:var(--f-display);font-size:1.35rem}
.bill-state{font-size:.88rem;color:var(--ok);font-weight:500;text-align:center}
.c-foot{text-align:center;font-size:.78rem;color:var(--soft);letter-spacing:.06em}

/* ---------- kasa ---------- */
.k-wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.k-head{background:var(--ink);color:var(--sand)}
.k-head-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.k-name{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--cream)}
.k-head .label{color:#C9AE95}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{position:relative;min-height:42px;padding:.4rem 1rem;border-radius:4px;border:1px solid rgba(242,227,198,.3);background:transparent;color:var(--sand);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.tabs .badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:.72rem;display:flex;align-items:center;justify-content:center;padding:0 5px}
.k-head .btn{background:transparent;color:var(--sand);border-color:rgba(242,227,198,.3)}
@media (max-width:720px){
  .k-head-in{display:grid;grid-template-columns:minmax(0,1fr) auto}
  .k-head-in .tabs{grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .k-head-in .tabs button{padding-inline:.3rem;font-size:.86rem}
}
main.k-wrap{padding-block:20px 48px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.alert{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--red);color:#fff;border-radius:4px;padding:12px 16px;font-weight:500}
.alert .btn{background:#fff;color:var(--wine);border-color:#fff;min-height:36px}
.k-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.k-cols{grid-template-columns:minmax(0,1fr)}}
.k-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-size:1.5rem;font-weight:600;margin-bottom:10px}
.k-h .label{font-family:var(--f-body)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ticket{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--wine);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ticket.late{border-top-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.t-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.t-table{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1}
.t-time{font-size:.8rem;color:var(--soft);text-align:right}
.t-items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:1rem}
.t-items b{font-family:var(--f-display);font-size:1.15rem;margin-right:4px}
.t-note{background:var(--sand);border-radius:3px;padding:6px 9px;font-size:.88rem}
.t-eta{font-size:.82rem;color:var(--soft)}
.t-eta.late{color:var(--red);font-weight:600}
.done-list{display:flex;flex-direction:column;gap:6px}
.done-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--white);border:1px solid var(--line);border-radius:4px;font-size:.9rem}
.done-row .d{flex:1;min-width:0;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-row b{font-family:var(--f-display);font-size:1.1rem}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tbl{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:118px}
.tbl:hover{border-color:var(--wine)}
.tbl.busy{border-color:var(--line-2);background:var(--cream)}
.tbl.bill{border:2px solid var(--red);background:var(--warn-soft)}
.tbl-n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1}
.tbl-t{font-family:var(--f-display);font-size:1.3rem;font-weight:600;margin-top:auto}
.tbl-s{font-size:.78rem;color:var(--soft)}
.tbl.bill .tbl-s{color:var(--wine);font-weight:600}
.detail{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.detail h3{font-size:1.8rem}
.detail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.detail li{display:flex;justify-content:space-between;gap:12px}
.detail li span:last-child{white-space:nowrap}
.move-box{border-top:1px dashed var(--line-2);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.pick-table button.busy{border-style:dashed;color:var(--soft)}
.rep-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.rep-head .pick-table button{min-width:auto;padding:0 14px;font-family:var(--f-body);font-weight:500;font-size:.9rem}
.rep-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rep-tile{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.rep-tile b{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1}
.rep-tile small{color:var(--soft);font-size:.8rem}
.rep-top{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.rep-top li span{display:inline-block;min-width:60%}
.rep-top b{float:right;font-size:1.1rem}
.rep-hours{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.rep-bar{display:grid;grid-template-columns:52px minmax(0,1fr) 30px;align-items:center;gap:8px;font-size:.84rem}
.rep-bar i{display:block;height:12px;background:var(--wine);border-radius:2px}
.rep-bar b{text-align:right}
.pl-box{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px 14px}

.ed-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 86px 96px;gap:8px;align-items:end}

}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qr-card{background:var(--white);border:1px solid var(--line);padding:8px}
.qr-in{border:1px solid var(--wine);outline:1px solid var(--wine);outline-offset:-4px;padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.qr-cafe{font-family:var(--f-display);font-weight:700;font-size:1.1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.qr-img img,.qr-img canvas{width:140px!important;height:140px!important}
.qr-hint{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pick-card{display:flex;flex-direction:column;gap:2px;background:var(--white);border:1px solid var(--line);padding:16px;color:var(--ink);text-decoration:none}

.s-danger{border-top:1px solid var(--line-2);padding-top:26px}
@media (max-width:480px){
  .qr-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

@media print{
  body{background:#fff}
  .s-head,.s-hero,.no-print,.toast{display:none!important}
  .s-main{padding:0}
  .qr-grid{grid-template-columns:repeat(3,1fr);gap:8mm}
  .qr-card{break-inside:avoid}
}

/* Yoğunluk ve iptal */
.busy-note{display:flex;align-items:center;gap:8px;background:#FBE9D0;border:1px solid #E9C48F;color:var(--wine);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:.9rem}

/* ================= Garson uygulaması ================= */
body.g-body{background:var(--cream)}
.g-app{min-height:100svh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.g-head{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--cream);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.g-head div{display:flex;flex-direction:column;line-height:1.15}
.g-kick{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:#C9AE95}
.g-head b{font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.g-pulse{background:var(--red);color:#fff;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;animation:gpulse 1.4s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 6px rgba(214,40,40,.3)}}
.g-ok{font-size:.8rem;color:#C9AE95;border:1px solid rgba(242,227,198,.3);padding:5px 12px;border-radius:999px}
.g-sound{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--sand);color:var(--ink);font:inherit;font-size:.86rem;padding:12px 16px;cursor:pointer}
.g-main{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.g-h{font-family:var(--f-display);font-size:1.7rem;font-weight:700;margin:6px 0 2px;display:flex;align-items:center;gap:10px}
.g-h span{font-family:var(--f-body);font-size:.8rem;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px}
.g-calls{display:flex;flex-direction:column;gap:8px}
.g-call{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-left:5px solid #E0A13A;border-radius:10px;padding:12px}
.g-call.bill{border-left-color:var(--red)}
.g-ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#FBEBC9;color:#8A5A0B}
.g-call.bill .g-ci{background:var(--warn-soft);color:var(--wine)}
.g-call b{display:block;font-size:1.05rem}.g-call small{color:var(--soft);font-size:.82rem}
.g-btn{min-height:44px;padding:0 16px;border-radius:8px;border:0;background:var(--wine);color:#fff;font:inherit;font-weight:500;font-size:.92rem;cursor:pointer}
.g-btn.wide{width:100%}
.g-btn:active{transform:scale(.98)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.g-tbl{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;cursor:pointer;transition:transform .15s}
.g-tbl:active{transform:scale(.96)}
.g-tbl .n{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.g-tbl .s{font-size:.74rem;color:var(--soft)}
.g-tbl .t{font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.g-tbl.busy{background:var(--sand);border-color:var(--line-2)}
.g-tbl.ready{background:var(--ok-soft);border-color:var(--ok)}.g-tbl.ready .s{color:var(--ok);font-weight:600}
.g-tbl.wait{background:#FBEBC9;border-color:#E0A13A}.g-tbl.wait .s{color:#8A5A0B;font-weight:600}
.g-tbl.bill{background:var(--red);border-color:var(--red);color:#fff}.g-tbl.bill .s{color:#fff;font-weight:600}
.g-tbl.bill,.g-tbl.wait{animation:gpulse 1.4s ease-in-out infinite}
.g-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--soft);margin-top:4px}
.g-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.g-legend .busy::before{background:var(--sand)}.g-legend .ready::before{background:var(--ok-soft);border-color:var(--ok)}.g-legend .wait::before{background:#FBEBC9;border-color:#E0A13A}.g-legend .bill::before{background:var(--red);border-color:var(--red)}
.g-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--soft);background:var(--white);border:1px dashed var(--line-2);border-radius:12px;padding:32px 20px}
.g-empty svg{width:40px;height:40px;color:var(--line-2)}
.g-ready{background:var(--white);border:1px solid var(--line);border-top:5px solid var(--ok);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.g-ready.late{border-top-color:var(--red)}
.g-r-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-r-top b{font-family:var(--f-display);font-size:1.6rem}
.g-r-top small{color:var(--soft);font-size:.8rem}.g-ready.late .g-r-top small{color:var(--red);font-weight:600}
.g-ready ul{margin:0;padding:0;list-style:none;font-size:1rem}
.g-note{font-size:.86rem;color:var(--wine);background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin:0}
.g-lbl{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.g-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.g-pick::-webkit-scrollbar{display:none}
.g-pick button{flex-shrink:0;min-width:46px;min-height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--white);color:var(--ink);font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer}
.g-pick button[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.g-cat{font-family:var(--f-display);font-size:1.3rem;font-weight:700;margin:10px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.g-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.g-item b{display:block;font-weight:500}.g-item b em{font-style:normal;font-size:.78rem;color:var(--wine);background:var(--warn-soft);border-radius:4px;padding:1px 6px;margin-left:4px}
.g-item small{color:var(--soft);font-size:.8rem}
.g-sendbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--cream);border-top:1px solid var(--line);padding-top:10px;margin-top:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -12px 20px -16px rgba(58,10,10,.4)}
.g-sum{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem}.g-sum b{font-family:var(--f-display);font-size:1.3rem}
.g-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px -20px rgba(58,10,10,.5)}
.g-nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;border:0;background:none;color:var(--soft);font:inherit;font-size:.74rem;cursor:pointer}
.g-nav button[aria-current="page"]{color:var(--wine);font-weight:600}
.g-nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--wine)}
.g-badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-style:normal;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.g-scrim{position:fixed;inset:0;z-index:30;background:rgba(58,10,10,.45);animation:gfade .25s ease}
.g-sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:86svh;overflow-y:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:gup .32s cubic-bezier(.2,.7,.2,1);max-width:720px;margin:0 auto}
@keyframes gup{from{transform:translateY(100%)}to{transform:none}}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.g-grab{display:block;width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 10px}
.g-s-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.g-s-top h3{font-family:var(--f-display);font-size:2rem;font-weight:700;margin:0}
.g-tag{font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px}
.g-tag.bill{background:var(--red);color:#fff}.g-tag.wait{background:#FBEBC9;color:#8A5A0B}
.g-bill{margin:0;padding:0;list-style:none}
.g-bill li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.g-info{font-size:.86rem;color:var(--soft);margin:8px 0 0}
.g-s-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
@media (prefers-reduced-motion:reduce){.g-pulse,.g-tbl.bill,.g-tbl.wait{animation:none}.g-sheet,.g-scrim{animation:none}}
.g-body .toast{top:calc(78px + env(safe-area-inset-top,0px));bottom:auto}
.g-th{flex-shrink:0;width:58px;height:58px;border-radius:12px;overflow:hidden;box-shadow:0 4px 10px -6px rgba(58,10,10,.6);background:#6B4220}
.g-th img,.g-th svg{width:100%;height:100%;object-fit:cover;display:block}
.g-th.sm{width:40px;height:40px;border-radius:9px}
.g-item{justify-content:flex-start}
.g-it-txt{flex:1;min-width:0}
.g-r-items{display:flex;flex-direction:column;gap:8px}
.g-r-items li{display:flex;align-items:center;gap:10px}
.g-th{position:relative}
.g-th img{position:absolute;inset:0}
.dish-img{position:relative}
.dish-img img{position:absolute;inset:0}

/* ================= Premium menü kartları ================= */
.cat-h{justify-content:center;text-align:center;font-size:2rem;font-weight:700;letter-spacing:-.01em;margin:26px 0 16px;gap:14px}
.cat-h::before{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2))}
.cat-h::after{background:linear-gradient(90deg,var(--line-2),transparent)}
.dish-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.dish{display:flex;flex-direction:column;gap:0;padding:0;background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 22px 44px -30px rgba(58,10,10,.55);border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:1px solid var(--line)}
.dish-img{width:100%;height:auto;aspect-ratio:16/10;max-width:100%;border-radius:0;background:#6B4220}
.dish-img::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(30,6,4,.55));pointer-events:none}
.dish-img img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.dish:active .dish-img img{transform:scale(1.03)}
.dish-tag{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,248,236,.93);color:var(--ink);font-size:.8rem;font-weight:500;padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.dish-tag.busy{background:var(--red);color:#fff}
.dish-img .alg-warn{position:absolute;z-index:2;top:12px;right:12px}
.dish-img .ar-open{position:absolute;z-index:2;left:12px;bottom:12px;margin:0;background:rgba(58,10,10,.82);border:1px solid rgba(242,227,198,.35);color:var(--cream);backdrop-filter:blur(4px)}
.dish-body{padding:16px 18px 18px;gap:6px}
.dish-name{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
.dish-desc{font-family:var(--f-display);font-style:italic;font-size:1.08rem;line-height:1.35}
.dish-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dish-facts span{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;color:var(--soft);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dish-facts .alg{color:var(--wine);background:var(--warn-soft);border-color:transparent}
.dish-meta{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line-2)}
.dish-meta .dish-price{font-size:1.6rem}

/* Mars Zeka — ortak yardımcılar (klasik script; window.S altına yazar). */
(function(){
  "use strict";
  var S = window.S = window.S || {};

  S.$ = function(id){ return document.getElementById(id); };
  S.esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  S.fmt = function(n){ return Math.round(Number(n) || 0).toLocaleString("tr-TR") + " ₺"; };
  S.sum = function(items){ return (items || []).reduce(function(s, i){ return s + (Number(i.price) || 0) * (Number(i.qty) || 0); }, 0); };
  S.summary = function(items){ return (items || []).map(function(i){ return i.qty + "× " + i.name; }).join(", "); };
  S.newId = function(){ return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  S.clock = function(ms){ return new Date(ms || Date.now()).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); };
  S.ago = function(ms){ var m = Math.max(0, Math.round((Date.now() - (ms || 0)) / 60000)); return m < 1 ? "şimdi" : m + " dk önce"; };
  S.DEFAULT_MINS = 15;
  /* Tahmini süre: yemekler mutfakta paralel hazırlanır, en uzun süren belirler. */
  S.eta = function(items, menu){
    var max = 0;
    (items || []).forEach(function(i){
      var m = (menu || []).find(function(x){ return x.id === i.id; });
      var mins = Number(m && m.mins) || S.DEFAULT_MINS;
      if (mins > max) max = mins;
    });
    return max || S.DEFAULT_MINS;
  };
  /* Mutfak yoğunluğu: hazırlanmayı bekleyen sipariş sayısına göre otomatik ek süre + kasanın elle eklediği süre.
     2 siparişe kadar ek yok; sonra her 2 sipariş için +5 dk (en fazla +30). */
  S.loadInfo = function(orders, cafe){
    var queue = (orders || []).filter(function(o){ return o.status === "new"; }).length;
    var auto = Math.min(30, Math.max(0, Math.ceil((queue - 2) / 2)) * 5);
    var manual = Math.max(0, Math.min(60, Number(cafe && cafe.busyExtra) || 0));
    return { queue: queue, auto: auto, manual: manual, extra: auto + manual };
  };

  /* Dosya indir (CSV vb.). */

    catch(e){ S.toast("Dosya indirilemedi"); }

  /* Porsiyon: ürünün "p15" (1,5 porsiyon fiyatı) alanı doluysa iki seçenek olur. Sepet anahtarı: "id" ya da "id@15". */
  S.options = function(i){

  /* Porsiyon miktarı serbest metin ("180 gr et", "300 ml"). Baştaki gr/ml sayısı 1,5 porsiyonda ölçeklenir. */
  S.amountText = function(i, factor){
    var t = String(i.amount || "").trim(); if (!t) return "";
    if (!factor || factor === 1) return t;
    var m = t.match(/^(\d+(?:[.,]\d+)?)\s*(gr|g|ml|cl|kg)\b(.*)$/i);
    if (!m) return t + " × 1,5";
    var n = Math.round(parseFloat(m[1].replace(",", ".")) * factor);
    return n + " " + m[2] + m[3];
  };
  S.cartLines = function(cart, menu){

    return out;

  /* Alerjenler (Türk Gıda Kodeksi'ndeki başlıca gruplardan sade bir seçim). */

  S.slugify = function(s){
    var map = { "ç":"c","ğ":"g","ı":"i","İ":"i","ö":"o","ş":"s","ü":"u","Ç":"c","Ğ":"g","Ö":"o","Ş":"s","Ü":"u" };
    return String(s || "").replace(/[çğıİöşüÇĞÖŞÜ]/g, function(c){ return map[c]; }).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  };
  S.sha256 = function(text){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2, "0"); }).join("");
    });
  };
  S.lsGet = function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } };
  S.lsSet = function(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch(e){} };

  var toastT;
  S.toast = function(msg){
    var t = S.$("toast"); if (!t) return;

    clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2800);
  };
  S.errText = function(e){
    var c = (e && (e.code || e.message)) || "";
    if (/permission|invalid_argument/.test(c)) return "Bu işlem için yetkin yok.";
    if (/unavailable|offline/.test(c)) return "İnternet bağlantısı yok. Bağlantı gelince tekrar dene.";
    if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "İşletme kodu, kullanıcı adı ya da şifre hatalı.";

    if (/email-already-in-use/.test(c)) return "Bu kullanıcı adı bu işletmede zaten var.";

  /* ses (ilk dokunuşta açılır) */
  var AC = null, unlockCbs = [];

    /* ekranı dokunuş bittikten sonra yenile; yoksa ilk dokunuştaki düğme kaybolur ve basış boşa gider */
    if (!S.audioReady) { S.audioReady = true; setTimeout(function(){ unlockCbs.splice(0).forEach(function(f){ try { f(); } catch(e){} }); }, 350); }
  }, { passive: true });
  S.onAudioReady = function(f){ if (S.audioReady) f(); else unlockCbs.push(f); };
  /* Kasa tableti uykuya geçmesin (destekleyen tarayıcılarda). */
  var wake = null;
  S.keepAwake = function(){
    try { if (navigator.wakeLock && !wake && document.visibilityState === "visible") navigator.wakeLock.request("screen").then(function(w){ wake = w; w.addEventListener("release", function(){ wake = null; }); }).catch(function(){}); } catch(e){}

  S.beep = function(times, freq){
    try {
      if (!AC) return;
      var t0 = AC.currentTime;
      for (var i = 0; i < times; i++) {
        var o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * 0.28;
        o.type = "sine"; o.frequency.value = freq; o.connect(g); g.connect(AC.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.start(t); o.stop(t + 0.24);
      }
    } catch(e){}
  };

  /* Fotoğrafı küçült: en uzun kenar 640px, JPEG. Veritabanında saklanır (Storage gerekmez). */
  S.shrinkPhoto = function(file){
    return new Promise(function(resolve, reject){
      if (!file || !/^image\//.test(file.type)) { reject(new Error("not-image")); return; }
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var max = 640, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * r); c.height = Math.round(h * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var q = 0.78, out = c.toDataURL("image/jpeg", q);
        while (out.length > 180000 && q > 0.4) { q -= 0.08; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("bad-image")); };
      img.src = url;
    });
  };

    var z = (cafe && cafe.zones) || {}, t = String(table);

S.billLines = function(orders){

S.payState = function(f, lines, ui){
  var pays = (f && Array.isArray(f.payments)) ? f.payments : [], keys = {}, paid = 0, eq = pays.filter(function(p){ return p.mode === "esit"; });
  pays.forEach(function(p){ paid += Number(p.amount) || 0; (p.units || []).forEach(function(k){ keys[k] = 1; }); });
  var total = S.sum(lines), left = Math.max(0, total - paid);
  var units = [];
  lines.forEach(function(l){ for (var i = 0; i < l.qty; i++) { var k = l.key + "|" + i; units.push({ key: k, name: l.name, price: l.price, paid: !!keys[k] }); } });
  var n = (ui && ui.n) || (eq.length ? eq[eq.length - 1].n : 0) || 2;
  var peopleLeft = Math.max(1, n - eq.length), per = Math.ceil(left / peopleLeft), last = left - per * (peopleLeft - 1);
  var sel = (ui && ui.sel) || {}, selSum = units.reduce(function(s, u){ return s + (sel[u.key] && !u.paid ? u.price : 0); }, 0);
  return { pays: pays, total: total, paid: paid, left: left, units: units, n: n, eqPaid: eq.length, peopleLeft: peopleLeft, per: per, last: last, sel: sel, selSum: Math.min(selSum, left) };
};
/* staff: ödeme kaydı düğmeleri görünür; değilse (müşteri) sadece hesap makinesi */

  } else {

/* "Tutar gir": yazılan tutar kalandan fazlaysa fark para üstüdür; hesaba kalan kadarı yazılır */

/* Bir ödemeyi ekler; yeni payments dizisini döndürür */
S.addPayment = function(P, ui, mode, by){
  var amt = mode === "esit" ? (P.peopleLeft === 1 ? P.left : Math.min(P.per, P.left)) : mode === "tutar" ? S.amountInfo(P, ui).take : P.selSum;
  if (!(amt > 0)) return null;
  var p = { id: S.newId(), amount: amt, mode: mode, at: Date.now(), by: by || "" };
  if (mode === "esit") p.n = P.n;
  else p.units = P.units.filter(function(u){ return P.sel[u.key] && !u.paid; }).map(function(u){ return u.key; });
  return P.pays.concat([p]);
};

/* Masa oturma süresi: QR okutulduğu an (seatedAt) ya da ilk açık sipariş. 5 saatten eski kayıt unutulmuş sayılır. */
S.SEAT_MAX = 5 * 3600000;
S.seatInfo = function(f, orders){
  var now = Date.now(), at = Number(f && f.seatedAt) || 0;
  if (at && now - at > S.SEAT_MAX) at = 0;
  var list = (orders || []).filter(function(o){ return o.status !== "cancelled"; });
  var first = list.reduce(function(m, o){ return Math.min(m, o.createdAt || now); }, Infinity);
  var last = list.reduce(function(m, o){ return Math.max(m, o.createdAt || 0); }, 0);
  if (!at && list.length) at = first;
  if (!at) return null;
  return { since: at, seatMin: Math.max(0, Math.floor((now - at) / 60000)), noOrder: !list.length, lastMin: last ? Math.max(0, Math.floor((now - last) / 60000)) : null };
};
S.loginView = function(title, error, prefill, hint, noCode){
    var code = S.lsGet("sirala-cafe-code") || prefill || "";
    var top = '<main class="login"><div class="login-card"><div class="brand-sm">Mars Zeka</div><h1>' + S.esc(title) + '</h1>';
    var err = error ? '<p class="form-err" role="alert">' + S.esc(error) + '</p>' : '';
    var tip = hint ? '<p class="login-hint">' + hint + '</p>' : '';
    if (!code && !noCode) {
      return top + '<p class="muted">İş yerinizin kodunu yazın. Bu telefon kodu hatırlar, bir daha sorulmaz.</p>' +
        '<form id="loginCode" class="login-form" novalidate>' +
        '<label class="fld" for="lg-code"><span>İş yeri kodu</span><input id="lg-code" autocapitalize="none" autocomplete="organization" placeholder="ör. kuzey-sofrasi" required></label>' +
        err + '<button class="btn btn-primary btn-lg wide" type="submit">Devam</button>' + tip + '</form></div></main>';
    }
    return top + (noCode ? '<p class="muted">Yönetici e-postanız ve şifrenizle girin.</p>' :
        '<div class="login-place"><span>İş yeri</span><b>' + S.esc(code) + '</b><button type="button" class="btn btn-sm btn-ghost" data-login="change">Değiştir</button></div>') +
      '<form id="loginForm" class="login-form" novalidate>' +
      '<label class="fld" for="lg-user"><span>' + (noCode ? "E-posta" : "Kullanıcı adı") + '</span><input id="lg-user" autocapitalize="none" autocomplete="username" required></label>' +
      '<label class="fld" for="lg-pass"><span>Şifre</span><input id="lg-pass" type="password" autocomplete="current-password" required></label>' +
      err + '<button class="btn btn-primary btn-lg wide" type="submit">Giriş yap</button>' + tip + '</form></div></main>';
  };
  /* onError(mesaj): mesaj null ise sadece ekranı yeniler (adım değişti). */
  S.bindLogin = function(B, onError){
    var c = S.$("loginCode");
    if (c) c.addEventListener("submit", function(e){
      e.preventDefault();
      var code = S.slugify(S.$("lg-code").value || "");
      if (code.length < 2) { onError("İş yeri kodunu yazın."); return; }
      (B.cafeExists ? B.cafeExists(code) : Promise.resolve(true)).then(function(ok){
        if (!ok) { onError("Bu kodla bir iş yeri bulunamadı. Patronunuza sorun."); return; }
        S.lsSet("sirala-cafe-code", code); onError(null);
      }).catch(function(err){ onError(S.errText(err)); });
    });
    var ch = document.querySelector("[data-login=change]");
    if (ch) ch.addEventListener("click", function(){ S.lsSet("sirala-cafe-code", ""); onError(null); });
    var f = S.$("loginForm"); if (!f) return;
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var code = S.lsGet("sirala-cafe-code") || "", user = S.$("lg-user").value.trim(), pass = S.$("lg-pass").value;
      if (!user || !pass) { onError("Kullanıcı adı ve şifre gerekli."); return; }
      B.login(S.userEmail(code, user), pass).catch(function(err){ onError(S.errText(err)); });
    });
  };
  S.isEditing = function(){
    var a = document.activeElement;
    return !!(a && a.closest && a.closest("#app") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "file");
  };
})();

/* Mars Zeka — yerel demo arka ucu: giriş yok, veriler bu telefonun tarayıcısında durur. Aynı arayüz. */
(function(){
  "use strict";
  var KEY = "sirala-local-v9", mem = null, subs = [];
  function load(){
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ mem = null; }
    if (!mem) mem = JSON.parse(JSON.stringify(window.SIRALA_SEED || { cafes: {}, orders: {}, tables: {}, photos: {}, priv: {} }));
    return mem;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} subs.slice().forEach(function(f){ try { f(); } catch(e){} }); }
  window.addEventListener("storage", function(e){ if (e.key === "sirala-demo-session") { USER = demoUser(); authCbs.slice().forEach(function(cb){ cb(USER); }); } if (e.key === KEY) { mem = null; load(); subs.slice().forEach(function(f){ f(); }); } });
  function watch(fn){ subs.push(fn); setTimeout(fn, 0); return function(){ subs = subs.filter(function(x){ return x !== fn; }); }; }
  var clone = function(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); };
  /* Demo: kimin gözünden bakıldığı (patron / garson) bu telefonda seçilir. */
  var authCbs = [];
  /* Demo oturumu: ilk açılışta patron girişli gelir; "Çıkış yap" ile kullanıcı adı/şifre ekranı denenir. */
  var CUST = { uid: "yerel-musteri", email: "", staff: false, anon: true };
  function session(){ var e = ""; try { var v = localStorage.getItem("sirala-demo-session"); if (v !== null) e = v; } catch(x){} return e; }
  function demoUser(){ var e = session(); return e ? { uid: "yerel-" + e, email: e, staff: true, anon: false } : null; }
  var USER = demoUser();
  function setSession(e){ try { localStorage.setItem("sirala-demo-session", e); } catch(x){} USER = demoUser(); authCbs.slice().forEach(function(cb){ cb(USER); }); }
  var hash = function(t){ var h = 5381; t = String(t); for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return "h" + (h >>> 0).toString(36); };
  function ordersOf(id){ var d = load(); return Object.keys(d.orders).map(function(k){ var o = clone(d.orders[k]); o.id = k; return o; }).filter(function(o){ return o.cafe === id; }); }

  window.SiralaBackend = {
    kind: "local",
    ready: Promise.resolve(),
    onAuth: function(cb){ authCbs.push(cb); setTimeout(function(){ cb(USER); }, 0); },

    currentUser: function(){ return USER || CUST; },
    ensureCustomer: function(){ return Promise.resolve(); },
    login: function(email, pass){
      var a = (load().accounts || {})[String(email).toLowerCase()];
      if (!a || a !== hash(pass)) return Promise.reject({ code: "auth/invalid-credential" });
      setSession(String(email).toLowerCase()); return Promise.resolve();
    },
    logout: function(){ setSession(""); return Promise.resolve(); },
    /* Patron çalışan hesabı açar / kaldırır. */
    createStaff: function(id, p){
      var d = load(), e = String(p.email).toLowerCase(); d.accounts = d.accounts || {};
      if (d.accounts[e]) return Promise.reject({ code: "auth/email-already-in-use" });
      if (String(p.password).length < 6) return Promise.reject({ code: "auth/weak-password" });
      d.accounts[e] = hash(p.password);
      var c = d.cafes[id]; c.staff = c.staff || {}; c.staff[e] = { name: p.name, role: p.role }; c.staffEmails = (c.staffEmails || []).concat([e]);
      save(); return Promise.resolve();
    },
    isAdmin: function(email){ return Promise.resolve(((load().admins || [])).indexOf(String(email).toLowerCase()) >= 0); },
    listAllCafes: function(){ var d = load(); return Promise.resolve(Object.keys(d.cafes).map(function(k){ var c = clone(d.cafes[k]); c.id = k; return c; })); },
    createBusiness: function(id, data, owner){
      var d = load(), e = String(owner.email).toLowerCase(); d.accounts = d.accounts || {};
      if (d.cafes[id]) return Promise.reject({ code: "kod-dolu" });
      if (d.accounts[e]) return Promise.reject({ code: "auth/email-already-in-use" });
      if (String(owner.password).length < 6) return Promise.reject({ code: "auth/weak-password" });
      d.accounts[e] = hash(owner.password);
      var staff = {}; staff[e] = { name: owner.name, role: "patron" };
      d.cafes[id] = Object.assign(clone(data), { staff: staff, staffEmails: [USER ? USER.email : "", e] });
      save(); return Promise.resolve();
    },
    removeStaff: function(id, email){
      var d = load(), e = String(email).toLowerCase(), c = d.cafes[id];
      if (c.staff) delete c.staff[e]; c.staffEmails = (c.staffEmails || []).filter(function(x){ return x !== e; });
      if (c.zones) delete c.zones[e]; if (d.accounts) delete d.accounts[e];
      save(); return Promise.resolve();
    },

    watchCafe: function(id, cb){ return watch(function(){ cb(clone(load().cafes[id]) || null); }); },
    cafeExists: function(id){ return Promise.resolve(!!load().cafes[id]); },
    createCafe: function(id, data){ load().cafes[id] = clone(data); save(); return Promise.resolve(); },
    updateCafe: function(id, patch){ var d = load(); d.cafes[id] = Object.assign(d.cafes[id] || {}, clone(patch)); save(); return Promise.resolve(); },
    listMyCafes: function(email){ var d = load(); return Promise.resolve(Object.keys(d.cafes).filter(function(k){ return (d.cafes[k].staffEmails || []).indexOf(email) >= 0; }).map(function(k){ return { id: k, name: d.cafes[k].name }; })); },

    watchOrders: function(id, opts, cb){
      return watch(function(){ cb(ordersOf(id).filter(function(o){ return !o.closed && (!opts || !opts.table || o.table === opts.table); }), false); });
    },
    addOrder: function(id, data){ var oid = "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); var x = clone(data); x.cafe = id; load().orders[oid] = x; save(); return Promise.resolve(oid); },
    updateOrder: function(id, oid, patch){ var d = load(); if (d.orders[oid]) Object.assign(d.orders[oid], clone(patch)); save(); return Promise.resolve(); },
    closeTable: function(id, table){
      var d = load(), now = Date.now();
      Object.keys(d.orders).forEach(function(k){ var o = d.orders[k]; if (o.cafe === id && o.table === table && !o.closed) { o.closed = true; o.closedAt = now; } });
      d.tables[id + "/" + table] = { billRequested: false, waiter: false, updatedAt: now }; save(); return Promise.resolve();
    },
    moveTable: function(id, from, to){
      var d = load(), now = Date.now(), n = 0;
      Object.keys(d.orders).forEach(function(k){ var o = d.orders[k]; if (o.cafe === id && o.table === from && !o.closed) { o.table = to; o.movedFrom = from; o.movedAt = now; n++; } });
      d.tables[id + "/" + from] = { billRequested: false, waiter: false, updatedAt: now }; save(); return Promise.resolve(n);
    },
    listOrders: function(id, since){ return Promise.resolve(ordersOf(id).filter(function(o){ return (o.createdAt || 0) >= since; })); },
    purgeClosed: function(id){ var d = load(), n = 0; Object.keys(d.orders).forEach(function(k){ if (d.orders[k].cafe === id && d.orders[k].closed) { delete d.orders[k]; n++; } }); save(); return Promise.resolve(n); },

    watchTables: function(id, cb){ return watch(function(){ var d = load(), m = {}; Object.keys(d.tables).forEach(function(k){ if (k.indexOf(id + "/") === 0) m[k.slice(id.length + 1)] = clone(d.tables[k]); }); cb(m); }); },
    setTable: function(id, table, patch){ var d = load(), k = id + "/" + table; d.tables[k] = Object.assign(d.tables[k] || {}, clone(patch)); save(); return Promise.resolve(); },

    watchPhotos: function(id, cb){ return watch(function(){ cb(clone(load().photos[id] || {})); }); },
    setPhoto: function(id, itemId, data){ var d = load(); d.photos[id] = d.photos[id] || {}; if (data) d.photos[id][itemId] = data; else delete d.photos[id][itemId]; save(); return Promise.resolve(); },

    addContact: function(id, oid, data){ var d = load(); d.contacts = d.contacts || {}; d.contacts[id + "/" + oid] = clone(data); save(); return Promise.resolve(); },
    watchContacts: function(id, cb){ return watch(function(){ var d = load(), m = {}; Object.keys(d.contacts || {}).forEach(function(k){ if (k.indexOf(id + "/") === 0) m[k.slice(id.length + 1)] = clone(d.contacts[k]); }); cb(m); }); },
    deleteContact: function(id, oid){ var d = load(); if (d.contacts) delete d.contacts[id + "/" + oid]; save(); return Promise.resolve(); },

    getPrivate: function(id){ return Promise.resolve(clone(load().priv[id] || {})); },
    setPrivate: function(id, patch){ var d = load(); d.priv[id] = Object.assign(d.priv[id] || {}, clone(patch)); save(); return Promise.resolve(); },

    reset: function(){ mem = null; try { localStorage.removeItem(KEY); } catch(e){} load(); save(); }
  };
})();

/* Mars Zeka — müşteri ekranı: fotoğraflı menü, yaklaşık süre, sipariş, masa hesabı. */
(function(){
  "use strict";
  window.SiralaApp = window.SiralaApp || {};
  var FIRE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-3 2-4 2-7 1.5 1 2 2.5 2 4 1-2 1-5 1-8z"/></svg>';
  var BELL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
  var WARN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>';
  var SCALE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20h14l-2-11H7z"/><path d="M9 9a3 3 0 0 1 6 0"/></svg>';
  var CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  window.SiralaApp.musteri = function(ctx){
    var B = ctx.B, cafeId = ctx.cafeId, online = !!ctx.online, table = online ? "Online" : ctx.table;
    var myIds = function(){ try { return JSON.parse(S.lsGet("sirala-online-ids") || "[]") || []; } catch(e){ return []; } };
    var mine = function(o){ var u = B.currentUser(); return o.source === "online" && (myIds().indexOf(o.id) >= 0 || (B.kind === "firebase" && u && o.uid === u.uid)); };
    var st = { avoid: (function(){ try { return JSON.parse(S.lsGet("sirala-avoid") || "{}") || {}; } catch(e){ return {}; } })(), algOpen: false, cafe: null, cafeLoaded: false, photos: {}, orders: [], all: [], ordLoaded: false, cart: {}, note: "", view: "menu", last: null, co: { mode: "gelal", name: S.lsGet("sirala-co-name") || "", phone: S.lsGet("sirala-co-phone") || "", address: S.lsGet("sirala-co-address") || "" }, busy: false, tbl: {}, err: null, offline: !navigator.onLine };
    var menu = function(){ return (st.cafe && Array.isArray(st.cafe.menu)) ? st.cafe.menu : []; };
    var cartItems = function(){ return S.cartLines(st.cart, menu()); };
    var tableLabel = online ? "Online sipariş" : "Masa " + table;
    var load = function(){ return S.loadInfo(st.all, st.cafe); };
    var alive = true, unsubs = [];

    if (!table) { S.$("app").innerHTML = '<main class="c-wrap c-main"><div class="empty-card"><h2>Masadaki QR kodu okutun</h2><p>Sipariş vermek için oturduğunuz masadaki QR kodu telefonunuzun kamerasıyla okutun.</p></div></main>'; return; }
    render();
    B.ready.then(function(){ return B.ensureCustomer(); }).then(function(){
      if (!alive) return;
      unsubs.push(B.watchCafe(cafeId, function(d){ st.cafe = d; st.cafeLoaded = true; dropSoldOut(); document.title = ((d && d.name) || "Menü") + " · " + tableLabel; render(); }, fail));
      unsubs.push(B.watchPhotos(cafeId, function(m){ st.photos = m; render(); }));
      unsubs.push(B.watchOrders(cafeId, null, function(list){ st.all = list; st.orders = list.filter(function(o){ return online ? mine(o) : String(o.table) === String(table) && o.source !== "online"; }); st.ordLoaded = true; render(); }, fail));
      if (!online) unsubs.push(B.watchTables(cafeId, function(m){ st.tbl = m[String(table)] || {}; markSeated(); render(); }));
    }).catch(fail);
    function dropSoldOut(){
      var gone = [];
      Object.keys(st.cart).forEach(function(k){
        var it = menu().find(function(x){ return x.id === k.split("@")[0]; });
        if (!it || it.out) { delete st.cart[k]; if (it && gone.indexOf(it.name) < 0) gone.push(it.name); }
      });
      if (gone.length) S.toast(gone.join(", ") + " az önce tükendi, sepetinizden çıkarıldı");
    }
    // QR okutulunca masa "oturuldu" olur; garson ekranında sayaç başlar. Eski (unutulmuş) kayıt varsa yenilenir.
    var seatDone = false;
    function markSeated(){
      if (seatDone || online) return; seatDone = true;
      var at = Number(st.tbl.seatedAt) || 0, now = Date.now();
      if (!at || now - at > S.SEAT_MAX) B.setTable(cafeId, String(table), { seatedAt: now, updatedAt: now }).catch(function(){});
    }
    function fail(e){ st.err = S.errText(e); render(); }
    window.addEventListener("online", function(){ st.offline = false; render(); });
    window.addEventListener("offline", function(){ st.offline = true; render(); });

    function head(){
      var cats = [];
      if (st.view === "menu") menu().forEach(function(i){ var c = i.cat || "Diğer"; if (cats.indexOf(c) < 0) cats.push(c); });
      return '<header class="c-head"><div class="c-wrap"><div class="c-head-in">' +
        (ctx.back ? '<button class="btn btn-sm btn-ghost" data-act="back">‹</button>' : '') +
        '<div class="c-name">' + S.esc((st.cafe && st.cafe.name) || "Menü") + '</div>' +
        (st.cafeLoaded && st.cafe && !online ? (st.tbl.waiter || st.tbl.billRequested
          ? '<span class="waiter-btn on" role="status">' + BELL + 'Garson geliyor</span>'
          : '<button class="waiter-btn" data-act="waiter">' + BELL + 'Garson çağır</button>') : '') +
        '<div class="c-table">' + S.esc(tableLabel) + '</div></div>' +
        (cats.length > 1 ? '<nav class="c-chips" aria-label="Kategoriler">' + cats.map(function(c){ return '<button type="button" data-act="cat" data-v="kat-' + S.slugify(c) + '">' + S.esc(c) + '</button>'; }).join("") + '</nav>' : '') +
        '</div></header>' + (st.offline ? '<div class="offline">İnternet bağlantısı yok. Bağlantı gelince siparişinizi gönderebilirsiniz.</div>' : '');
    }
    function photo(i){ var p = st.photos[i.id]; return S.foodArt(i.name) + (p ? '<img src="' + S.esc(p) + '" alt="' + S.esc(i.name) + '" loading="lazy" onerror="this.remove()">' : ''); }
    function stepper(key, name){
      var q = st.cart[key] || 0;
      return '<div class="stepper">' + (q ? '<button class="round" data-act="dec" data-v="' + S.esc(key) + '" aria-label="' + S.esc(name) + ' azalt">−</button><span class="q">' + q + '</span>' : '') +
        '<button class="round' + (q ? "" : " round-add") + '" data-act="inc" data-v="' + S.esc(key) + '" aria-label="' + S.esc(name) + ' ekle">+</button></div>';
    }
    function avoidedIn(i){ return (i.allergens || []).filter(function(a){ return st.avoid[a]; }); }
    function dish(i){
      var base = Number(i.mins) || S.DEFAULT_MINS, mins = base + load().extra, opts = S.options(i), hit = avoidedIn(i);
      var buy = i.out ? '<div class="dish-meta"><span class="dish-price">' + S.fmt(i.price) + '</span><span class="dish-out">Bugün tükendi</span></div>'
        : opts.length === 1 ? '<div class="dish-meta"><span class="dish-price">' + S.fmt(i.price) + '</span>' + stepper(i.id, i.name) + '</div>'
        : opts.map(function(o){ return '<div class="dish-meta portion"><span class="por-l">' + o.label + ((o.amount || o.kcal) ? '<small>' + [o.amount, o.kcal ? o.kcal + ' kcal' : ''].filter(Boolean).map(S.esc).join(' · ') + '</small>' : '') + '</span><span class="dish-price">' + S.fmt(o.price) + '</span>' + stepper(o.key, i.name + " " + o.label) + '</div>'; }).join("");
      var facts = [];
      if (opts.length === 1 && i.amount) facts.push(SCALE + S.esc(i.amount));
      if (opts.length === 1 && Number(i.kcal) > 0) facts.push(FIRE + Number(i.kcal) + ' kcal');
      return '<article class="dish' + (i.out ? " out" : "") + (hit.length ? " avoid" : "") + '"><div class="dish-img">' + photo(i) +
        (i.out ? '' : '<span class="dish-tag' + (mins > base ? ' busy' : '') + '">' + CLOCK + '~' + mins + ' dk</span>') +
        (hit.length ? '<span class="alg-warn">' + WARN + S.esc(hit.map(S.allergenName).join(", ")) + ' içerir</span>' : '') +
        (i.model && !i.out ? '<button class="ar-open" data-act="ar" data-v="' + S.esc(i.id) + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg>Masada gör · 3D</button>' : '') +
        '</div><div class="dish-body">' +
        '<h3 class="dish-name">' + S.esc(i.name) + '</h3>' + (i.desc ? '<p class="dish-desc">' + S.esc(i.desc) + '</p>' : '') +
        (facts.length || (i.allergens || []).length ? '<div class="dish-facts">' + facts.map(function(f){ return '<span>' + f + '</span>'; }).join("") +
          ((i.allergens || []).length ? '<span class="alg">İçerir: ' + S.esc(i.allergens.map(S.allergenName).join(", ")) + '</span>' : '') + '</div>' : '') +
        buy + '</div></article>';

      var tabs = [["gelen", "Siparişler", IC.inbox, nNew], ["masalar", "Masalar", IC.tables, nCalls], ["hazir", "Hazır", IC.ready, nReady], ["siparis", "Sipariş al", IC.order, 0]];

    };
    app.onfocusout = function(){ if (!st.user) return; setTimeout(function(){ if (!S.isEditing()) render(); }, 0); };
    app.onclick = function(e){
      var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
      var v = b.dataset.v;
      switch (b.dataset.act) {
        case "tab": st.tab = v; st.sheet = null; window.scrollTo(0, 0); if (v === "patron") { st.rep = null; loadRep(); } break;
        case "mine": st.mineOnly = !st.mineOnly; break;
        case "repDays": st.repDays = Number(v); st.rep = null; loadRep(); break;
        case "zoneFor": st.zoneFor = st.zoneFor === v ? null : v; break;
        case "rmAsk": st.confirmRm = v; break;
        case "rmNo": st.confirmRm = null; break;
        case "rmYes": st.confirmRm = null; B.removeStaff(cafeId, v).then(function(){ S.toast("Çalışan kaldırıldı, erişimi kapandı"); }).catch(function(x){ S.toast(S.errText(x)); }); return;
        case "zoneT": { var z = JSON.parse(JSON.stringify((st.cafe && st.cafe.zones) || {})), e = st.zoneFor; if (!e) break;
          Object.keys(z).forEach(function(k){ if (k !== e) z[k] = (z[k] || []).map(String).filter(function(x){ return x !== v; }); });
          var arr = (z[e] || []).map(String), ix = arr.indexOf(v); if (ix >= 0) arr.splice(ix, 1); else arr.push(v);
          z[e] = arr.sort(function(a, b){ return a - b; }); B.updateCafe(cafeId, { zones: z }).catch(function(x){ S.toast(S.errText(x)); }); return; }
        case "busy": { var cur = S.loadInfo(st.orders, st.cafe).manual, dl = Number(v) - cur;
          st.orders.filter(function(o){ return o.status === "new"; }).forEach(function(o){ B.updateOrder(cafeId, o.id, { eta: Math.max(1, (Number(o.eta) || S.DEFAULT_MINS) + dl) }); });
          B.updateCafe(cafeId, { busyExtra: Number(v) }).catch(function(x){ S.toast(S.errText(x)); }); return; }
        case "sheet": st.sheet = v; st.confirmClose = false; st.split = null; break;
        case "spOpen": st.split = { t: String(v), mode: "esit", n: 0, sel: {} }; break;
        case "spMode": case "spN": case "spUnit": case "spPay": case "spUndo": case "spAmt": splitAct(b.dataset.act, v); return;
        case "sheetClose": st.sheet = null; st.confirmClose = false; break;
        case "going": clearFlags(v).then(function(){ S.toast("Masa " + v + ": gidiyorsunuz"); }); if (st.sheet) st.sheet = null; break;
        case "served": { var o = st.orders.find(function(x){ return x.id === v; }); if (o) served(o); return; }
        case "closeAsk": st.confirmClose = true; break;
        case "closeNo": st.confirmClose = false; break;
        case "closeYes": closeTable(v); return;
        case "vacate": vacate(v); st.sheet = null; break;
        case "addFor": st.tab = "siparis"; st.wTable = v; st.sheet = null; window.scrollTo(0, 0); break;
        case "wTable": st.wTable = v; break;
        case "inc": st.wCart[v] = (st.wCart[v] || 0) + 1; break;
        case "dec": if (st.wCart[v]) { st.wCart[v]--; if (!st.wCart[v]) delete st.wCart[v]; } break;
        case "send": send(); return;
        case "sound": S.beep(1, 660); try { if (navigator.vibrate) navigator.vibrate(80); } catch(x){} break;
        case "logout": unsubs.forEach(function(u){ try { u(); } catch(x){} }); unsubs = []; st.cafe = null; st.cafeLoaded = false; st.tab = "gelen"; B.logout(); return;
      }
      render(true);
    };
    S.onAudioReady(function(){ S.keepAwake(); if (st.user && !S.isEditing()) render(true); });
    var onVis = function(){ if (document.visibilityState === "visible") S.keepAwake(); };
    document.addEventListener("visibilitychange", onVis);
    return function(){ alive = false; clearInterval(tick); document.removeEventListener("visibilitychange", onVis); document.body.classList.remove("g-body"); unsubs.forEach(function(u){ try { u(); } catch(e){} }); };
  };
})();

/* Mars Zeka — yönetim ekranı (sistemi kuran kişi için): tüm işletmeler tek listede, yeni işletme + patron hesabı açma.

(function(){

  window.SiralaApp = window.SiralaApp || {};

  window.SiralaApp.yonetim = function(ctx){

    function create(){
      var f = st.form, code = S.slugify(f.code || f.name), user = f.user.trim().toLocaleLowerCase("tr-TR");
      st.err = !f.name.trim() ? "İşletme adını yazın." : code.length < 3 ? "İşletme kodu en az 3 karakter olmalı." : !(Number(f.tables) >= 1 && Number(f.tables) <= 80) ? "Masa sayısı 1–80 arası olmalı." :
        !f.owner.trim() ? "Patronun adını yazın." : !S.USER_RE.test(user) ? "Kullanıcı adı 3–20 karakter; harf, rakam, nokta, tire." : f.pass.length < 6 ? "Şifre en az 6 karakter olmalı." : null;
      if (st.err) { render(); return; }
      st.busy = true; render();
      B.createBusiness(code, { name: f.name.trim(), tables: Number(f.tables), menu: [], onlineOpen: true, delivery: true, zones: {}, createdAt: Date.now() },
        { email: S.userEmail(code, user), password: f.pass, name: f.owner.trim() })
        .then(function(){ st.made = { name: f.name.trim(), code: code, user: user, pass: f.pass }; st.form = { name: "", code: "", tables: "12", owner: "", user: "", pass: "" }; refresh(); })
        .catch(function(e){ st.err = S.errText(e); })
        .then(function(){ st.busy = false; render(); });
    }

    function link(label, href){ return href ? '<a class="btn btn-sm" href="' + S.esc(href) + '" target="_blank" rel="noopener">' + label + '</a>' : ''; }
    function render(){
      if (!alive || S.isEditing()) return;

      if (st.admin === null) { app.innerHTML = '<p class="muted center" style="padding:40px">Kontrol ediliyor…</p>'; return; }
      if (!st.admin) { app.innerHTML = '<main class="login"><div class="login-card"><h1>Yönetici değil</h1><p class="muted">' + S.esc(S.userName(st.user.email)) + ' hesabı yönetim ekranını açamaz.</p><button class="btn wide" data-act="logout">Başka hesapla giriş yap</button></div></main>'; return; }
      var cafes = st.cafes || [], tot = { n: 0, sum: 0 };

      var f = st.form;
      app.innerHTML = '<div class="y-app"><header class="g-head"><div><span class="g-kick">Mars Zeka</span><b>Yönetim</b></div><button class="g-who" data-act="logout">Çıkış</button></header><main class="g-main">' +
        '<div class="g-tiles"><div class="g-tile big"><span>Bugün · tüm işletmeler</span><b>' + S.fmt(tot.sum) + '</b><small>' + tot.n + ' sipariş · ' + cafes.length + ' işletme</small></div></div>' +
        (st.made ? '<section class="y-made"><b>' + S.esc(st.made.name) + ' açıldı</b><p>Patrona bu bilgileri verin:</p><dl><dt>İşletme kodu</dt><dd>' + S.esc(st.made.code) + '</dd><dt>Kullanıcı adı</dt><dd>' + S.esc(st.made.user) + '</dd><dt>Şifre</dt><dd>' + S.esc(st.made.pass) + '</dd></dl>' +
          '<div class="row-btns">' + link("Menüyü kur", L(st.made.code).kurulum) + link("Çalışan uygulaması", L(st.made.code).garson) + '</div><button class="btn btn-sm btn-ghost" data-act="madeOk">Tamam</button></section>' : '') +
        '<h3 class="g-cat">İşletmeler</h3>' + (st.cafes === null ? '<p class="muted">Yükleniyor…</p>' : cafes.length ? cafes.map(function(c){
          var x = st.stats[c.id], lk = L(c.id), staffN = Object.keys(c.staff || {}).length;

        '<label for="y-tables">Masa sayısı<input id="y-tables" type="number" inputmode="numeric" min="1" max="80" value="' + S.esc(f.tables) + '"></label>' +
        '<label for="y-owner">Patronun adı<input id="y-owner" maxlength="30" value="' + S.esc(f.owner) + '"></label>' +
        '<label for="y-user">Patronun kullanıcı adı<input id="y-user" autocapitalize="none" maxlength="20" value="' + S.esc(f.user) + '" placeholder="ör. mehmet"></label>' +
        '<label for="y-pass">Patronun şifresi (en az 6)<input id="y-pass" autocomplete="new-password" maxlength="40" value="' + S.esc(f.pass) + '"></label>' +
        (st.err ? '<p class="form-err" role="alert">' + S.esc(st.err) + '</p>' : '') +
        '<button class="btn btn-primary wide" type="submit"' + (st.busy ? " disabled" : "") + '>' + (st.busy ? "Açılıyor…" : "İşletmeyi aç") + '</button>' +
        '<p class="g-info">Kod sonradan değişmez; QR kodları ve girişler bu koda bağlıdır. Patron girince kendi çalışanlarını kendisi ekler.</p></form></main></div>';
    }

    var app = S.$("app");
    app.oninput = function(e){ var m = { "y-name": "name", "y-code": "code", "y-tables": "tables", "y-owner": "owner", "y-user": "user", "y-pass": "pass" }[e.target.id]; if (m) st.form[m] = e.target.value; };
    app.onfocusout = function(){ if (!st.user) return; setTimeout(function(){ if (!S.isEditing()) render(); }, 0); };
    app.onsubmit = function(e){ if (e.target.id === "newCafe") { e.preventDefault(); create(); } };

(function(){

    mutfak: '<path d="M6 13a6 6 0 1 1 12 0v6H6z"/><path d="M6 16h12"/>', masa: '<path d="M4 11h16M6 11v9M18 11v9M8 7h8l1 4H7z"/>',
    online: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', out: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
    reset: '<path d="M4 4v6h6"/><path d="M20 12a8 8 0 1 1-2.3-5.7L4 10"/>'
  };
  // Rol → izinli ekranlar (ilk eleman açılış ekranı)
  var ALLOW = { patron: ["garson", "mutfak"], garson: ["garson"], mutfak: ["mutfak"] };

  var USER = null, ROLE = null, CAFE = DEMO, authKnown = false, cafeUnsub = null, cafeFor = null;
  function cafeOf(email){ var x = /@([a-z0-9-]+)\.marszeka\.app$/.exec(email || ""); return x ? x[1] : DEMO; }

    var m = h.match(/^masa-(\d{1,3})$/), view = m ? "masa" : h === "online" ? "online" : h;
    window.scrollTo(0, 0);

    if (view === "yonetim") { bar.hidden = true; stop = SiralaApp.yonetim({ B: B, loginHint: ADMIN_HINT, links: function(code){ return code === DEMO ? { garson: "#", menu: "#masa-1", online: "#online" } : {}; } }); return; }
    // Girişsiz: sadece QR menüsü ve online sipariş açık, gerisi giriş ekranı
    if (!USER) {
      bar.hidden = true;
      if (view === "masa" || view === "online") return mountCustomer(view, m);
      stop = SiralaApp.garson({ B: B, cafeId: CAFE, followLogin: true, loginHint: HINT });
      return;
    }
    var allow = ALLOW[ROLE] || ["garson"];             // rolü bilinmeyen hesap: çalışan ekranı "erişim yok" der
    if (view !== "masa" && view !== "online" && allow.indexOf(view) < 0) view = allow[0];
    drawBar(view, allow);
    if (view === "masa" || view === "online") return mountCustomer(view, m);
    if (view === "mutfak") stop = SiralaApp.kasa({ B: B, cafeId: CAFE });
    else stop = SiralaApp.garson({ B: B, cafeId: CAFE, followLogin: true, loginHint: HINT });
  }
  function mountCustomer(view, m){
    if (view === "online") stop = SiralaApp.musteri({ B: B, cafeId: CAFE, online: true });
    else stop = SiralaApp.musteri({ B: B, cafeId: CAFE, table: m ? String(Number(m[1])) : "7" });
  }
  function drawBar(view, allow){
    var names = { garson: ROLE === "patron" ? "Patron" : "Garson", mutfak: "Mutfak" };
    var items = allow.map(function(v){ return ["#" + v, names[v], v === "garson" && ROLE === "patron" ? "patron" : v, v]; })
      .concat([["#masa-7", "Müşteri", "masa", "masa"], ["#online", "Online", "online", "online"]]);
    bar.hidden = false;
    bar.innerHTML = '<nav aria-label="Ekranlar">' + items.map(function(t){ return '<a href="' + t[0] + '"' + (view === t[3] ? ' aria-current="page"' : '') + '>' + I(ICON[t[2]]) + t[1] + '</a>'; }).join("") +
      (ROLE === "patron" ? '<button type="button" id="demoReset">' + I(ICON.reset) + 'Sıfırla</button>' : '') +
      '<button type="button" id="demoOut" class="out">' + I(ICON.out) + 'Çıkış</button></nav>';
    if (S.$("demoReset")) S.$("demoReset").onclick = function(){ B.reset(); try { localStorage.removeItem("sirala-demo-session"); localStorage.removeItem("sirala-online-ids"); } catch(e){} S.toast("Demo sıfırlandı"); location.hash = ""; location.reload(); };
    S.$("demoOut").onclick = function(){ B.logout(); location.hash = ""; };
  }

  // Giriş + rol: rol, iş yerinin çalışan listesinden okunur. Rol değişince ekran yeniden kurulur.
  function watchRole(){
    var code = USER ? cafeOf(USER.email) : DEMO;
    if (cafeFor === code && cafeUnsub) return;
    if (cafeUnsub) { cafeUnsub(); cafeUnsub = null; }
    cafeFor = code; CAFE = code;
    if (!USER) { ROLE = null; route(); return; }
    var first = true;
    cafeUnsub = B.watchCafe(code, function(d){
      var r = d && d.staff && d.staff[USER.email] ? d.staff[USER.email].role : null;
      if (first || r !== ROLE) { first = false; ROLE = r; route(); }
    }, function(){ ROLE = null; route(); });
  }
  B.onAuth(function(u){
    var nu = u && u.staff ? u : null, changed = !authKnown || (USER && USER.email) !== (nu && nu.email);
    USER = nu; authKnown = true;
    if (changed) { cafeFor = null; watchRole(); }
  });
  window.addEventListener("hashchange", function(){ if (authKnown) route(); });
})();
